<!doctype html><html lang="it"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07111c"><link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png"><link rel="apple-touch-icon" href="./icon-192.png">
<title>PESCA GPS</title>
<style>body{margin:0;background:#07111c;color:#eef7fb;font-family:Arial}main{max-width:650px;margin:auto;padding:20px}.c{background:#102333;border:1px solid #29485c;border-radius:18px;padding:18px;margin:14px 0}button{padding:13px 16px;border:0;border-radius:12px;font-weight:bold;background:#16a8c9;color:white}button:disabled{opacity:.45}.s{color:#a9c6d4;margin-top:10px}</style>
</head><body><main>
<div class="c"><h1>PESCA GPS</h1><div>Web App / PWA v1.2</div></div>
<div class="c"><h2>📲 Installa PESCA GPS</h2><p>Versione PWA corretta per Android.</p>
<button id="i" disabled>Installa app</button><div id="s" class="s">Controllo installazione…</div>
</div>
<div class="c"><h2>GPS</h2><button id="g">Avvia GPS</button><div id="gs" class="s">GPS non avviato.</div></div>
</main><script>
let dp=null,i=document.getElementById("i"),s=document.getElementById("s");
addEventListener("beforeinstallprompt",e=>{e.preventDefault();dp=e;i.disabled=false;s.textContent="Installazione disponibile. Premi “Installa app”."});
addEventListener("appinstalled",()=>{dp=null;i.disabled=true;s.textContent="PESCA GPS è stata installata."});
i.onclick=async()=>{if(!dp){s.textContent="Usa Chrome → ⋮ → Installa e crea scorciatoia → Installa";return}dp.prompt();let r=await dp.userChoice;s.textContent=r.outcome==="accepted"?"Installazione avviata.":"Installazione annullata.";dp=null;i.disabled=true};
g.onclick=()=>navigator.geolocation.watchPosition(p=>{let c=p.coords;document.getElementById("gs").textContent=`GPS OK — ${c.latitude.toFixed(6)}, ${c.longitude.toFixed(6)} · ±${Math.round(c.accuracy)} m`},e=>document.getElementById("gs").textContent="Errore GPS: "+e.message,{enableHighAccuracy:true,maximumAge:0,timeout:15000});
if("serviceWorker"in navigator) navigator.serviceWorker.register("./sw.js",{scope:"./"});
</script></body></html>
